{% extends 'base.html' %}

{% block content %}
<div class="auth-container" style="display: flex; justify-content: center; align-items: center; min-height: 75vh; padding: 40px 20px;">
    <div class="auth-box" style="width: 100%; max-width: 450px; background-color: #0f1938; padding: 40px; border-radius: 12px; border: 1px solid #1e293b80; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);">
        <h2 style="text-align: center; color: #ffffff; margin-bottom: 24px; font-weight: 700; font-size: 26px;">🔑 Verify OTP</h2>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div style="color: #f87171; background-color: #7f1d1d40; border: 1px solid #f8717140; padding: 10px; border-radius: 6px; margin-bottom: 20px; text-align: center; font-size: 14px;">
              {% for message in messages %}
                <p style="margin: 0;">{{ message }}</p>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}
        
        <form action="/verify-otp" method="POST">
            <div class="input-group" style="margin-bottom: 24px;">
                <label for="otp" style="display: block; margin-bottom: 8px; color: #94a3b8; font-size: 14px;">Enter 6-Digit OTP Code</label>
                <input type="text" id="otp" name="otp" placeholder="123456" maxlength="6" required style="width: 100%; padding: 12px 15px; border-radius: 6px; border: 1px solid #1e293b; background-color: #0b1120; color: #ffffff; font-size: 18px; letter-spacing: 4px; text-align: center; outline: none;">
            </div>
            
            <div class="form-action">
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; background-color: #2563eb; color: #ffffff; border: none; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; margin-bottom: 16px;">Verify Code ➔</button>
            </div>
        </form>
        
        <p class="auth-link" style="text-align: center; font-size: 13px; color: #94a3b8; margin: 0;">
            Didn't receive code? <a href="/forgot-password" style="color: #3b82f6; text-decoration: none; font-weight: 500;">Resend OTP</a>
        </p>
    </div>
</div>
{% endblock %}
