{% extends 'base.html' %}

{% block content %}
<div class="auth-container" style="display: flex; justify-content: center; align-items: center; min-height: 75vh; padding: 40px 20px;">
    <div class="auth-box" style="width: 100%; max-width: 450px; background-color: #0f1938; padding: 40px; border-radius: 12px; border: 1px solid #1e293b80; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);">
        <h2 style="text-align: center; color: #ffffff; margin-bottom: 24px; font-weight: 700; font-size: 26px;">🔐 Reset Password</h2>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div style="color: #f87171; background-color: #7f1d1d40; border: 1px solid #f8717140; padding: 10px; border-radius: 6px; margin-bottom: 20px; text-align: center; font-size: 14px;">
              {% for message in messages %}
                <p style="margin: 0;">{{ message }}</p>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}
        
        <form action="/reset-password" method="POST">
            <!-- Hidden Input for Browser Password Manager Identification -->
            <input type="email" name="email" value="{{ session.get('reset_email') }}" style="display: none;" autocomplete="username">

            <div class="input-group" style="margin-bottom: 24px;">
                <label for="password" style="display: block; margin-bottom: 8px; color: #94a3b8; font-size: 14px;">Enter New Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="new-password" style="width: 100%; padding: 12px 15px; border-radius: 6px; border: 1px solid #1e293b; background-color: #0b1120; color: #ffffff; font-size: 14px; outline: none;">
            </div>
            
            <div class="form-action">
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; background-color: #2563eb; color: #ffffff; border: none; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; margin-bottom: 16px;">Update Password ➔</button>
            </div>
        </form>
        
        <p class="auth-link" style="text-align: center; font-size: 13px; color: #94a3b8; margin: 0;">
            Want to cancel? <a href="/login" style="color: #3b82f6; text-decoration: none; font-weight: 500;">Back to Login</a>
        </p>
    </div>
</div>
{% endblock %}
